name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: npx cap add android
      - name: Add notification permissions
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - name: Sign APK with permanent key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/chronos.keystore"
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          mkdir -p signed
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/chronos.keystore" --ks-key-alias chronos --ks-pass env:KS_PASS --key-pass env:KS_PASS --out signed/app-debug.apk android/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --print-certs signed/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chronos-apk
          path: signed/app-debug.apk