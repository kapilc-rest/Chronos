<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronos Journal &amp; Public Blog</title>
    <meta name="description" content="An aesthetic calendar journal with daily time-based reminders, rich markdown editor, full-text search, and instant public blog publishing." />
    <meta property="og:title" content="Chronos Journal &amp; Public Blog" />
    <meta property="og:description" content="An aesthetic calendar journal with daily time-based reminders, rich markdown editor, full-text search, and instant public blog publishing." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      // Initialize theme early to avoid flash of wrong theme
      if (localStorage.getItem('chronos_theme') === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
