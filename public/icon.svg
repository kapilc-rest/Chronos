<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Outer Chronos Ring (Time/Calendar Cycle) -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#1e293b" stroke-width="20"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#emeraldGrad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="140 38 70 38" filter="url(#shadow)"/>

  <!-- Journal Spine & Open Book Form -->
  <path d="M196 320 C220 304, 240 304, 256 314 C272 304, 292 304, 316 320 L316 200 C292 186, 272 186, 256 196 C240 186, 220 186, 196 200 Z" fill="#0f172a" stroke="#475569" stroke-width="8" stroke-linejoin="round"/>
  <path d="M256 196 L256 314" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>

  <!-- Clock Hands (Anchored at center of daily reflection) -->
  <line x1="256" y1="256" x2="256" y2="164" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="318" y2="256" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="18" fill="#10b981"/>
  <circle cx="256" cy="256" r="8" fill="#ffffff"/>

  <!-- Daily Sparkle / Today Marker -->
  <circle cx="360" cy="152" r="22" fill="url(#cyanGrad)" filter="url(#shadow)"/>
  <circle cx="360" cy="152" r="9" fill="#ffffff"/>
</svg>
